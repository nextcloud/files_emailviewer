# Cases for extracting the file and inline attachments of an email.

- description: no attachments
  eml: "\r\n\
    Hello\r\n\
    "
  expectedAttachments:
    inline: []
    files: []

- description: file attachment
  eml: "Content-Type: multipart/mixed; boundary=\"BOUNDARY\"\r\n\
    \r\n\
    --BOUNDARY\r\n\
    \r\n\
    Hello\r\n\
    --BOUNDARY\r\n\
    Content-Disposition: attachment; filename=\"report.pdf\"\r\n\
    \r\n\
    data\r\n\
    --BOUNDARY--\r\n\
    "
  expectedAttachments:
    inline: []
    files:
      - { filename: report.pdf }

- description: inline attachment
  eml: "Content-Type: multipart/mixed; boundary=\"BOUNDARY\"\r\n\
    \r\n\
    --BOUNDARY\r\n\
    \r\n\
    Hello\r\n\
    --BOUNDARY\r\n\
    Content-Type: image/png\r\n\
    Content-Disposition: inline; filename=\"logo.png\"\r\n\
    Content-ID: <logo@example.com>\r\n\
    Content-Transfer-Encoding: base64\r\n\
    \r\n\
    iVBORw==\r\n\
    --BOUNDARY--\r\n\
    "
  expectedAttachments:
    inline:
      - { contentId: logo@example.com, filename: logo.png, mimeType: image/png, data: iVBORw== }
    files: []

- description: content ID without angle brackets
  eml: "Content-Type: multipart/mixed; boundary=\"BOUNDARY\"\r\n\
    \r\n\
    --BOUNDARY\r\n\
    \r\n\
    Hello\r\n\
    --BOUNDARY\r\n\
    Content-Type: image/png\r\n\
    Content-Disposition: inline; filename=\"logo.png\"\r\n\
    Content-ID: logo@example.com\r\n\
    Content-Transfer-Encoding: base64\r\n\
    \r\n\
    iVBORw==\r\n\
    --BOUNDARY--\r\n\
    "
  expectedAttachments:
    inline:
      - { contentId: logo@example.com, filename: logo.png, mimeType: image/png, data: iVBORw== }
    files: []

- description: inline attachment without file name
  eml: "Content-Type: multipart/mixed; boundary=\"BOUNDARY\"\r\n\
    \r\n\
    --BOUNDARY\r\n\
    \r\n\
    Hello\r\n\
    --BOUNDARY\r\n\
    Content-Type: image/png\r\n\
    Content-ID: <logo@example.com>\r\n\
    Content-Transfer-Encoding: base64\r\n\
    \r\n\
    iVBORw==\r\n\
    --BOUNDARY--\r\n\
    "
  expectedAttachments:
    inline:
      - { contentId: logo@example.com, filename: null, mimeType: image/png, data: iVBORw== }
    files: []

- description: attachment with empty content ID
  eml: "Content-Type: multipart/mixed; boundary=\"BOUNDARY\"\r\n\
    \r\n\
    --BOUNDARY\r\n\
    \r\n\
    Hello\r\n\
    --BOUNDARY\r\n\
    Content-Disposition: attachment; filename=\"logo.png\"\r\n\
    Content-ID: <>\r\n\
    \r\n\
    data\r\n\
    --BOUNDARY--\r\n\
    "
  expectedAttachments:
    inline: []
    files:
      - { filename: logo.png }

- description: attachment without file name
  eml: "Content-Type: multipart/mixed; boundary=\"BOUNDARY\"\r\n\
    \r\n\
    --BOUNDARY\r\n\
    \r\n\
    Hello\r\n\
    --BOUNDARY\r\n\
    Content-Disposition: attachment\r\n\
    \r\n\
    data\r\n\
    --BOUNDARY--\r\n\
    "
  expectedAttachments:
    inline: []
    files:
      - { filename: null }

- description: encoded file name
  eml: "Content-Type: multipart/mixed; boundary=\"BOUNDARY\"\r\n\
    \r\n\
    --BOUNDARY\r\n\
    \r\n\
    Hello\r\n\
    --BOUNDARY\r\n\
    Content-Disposition: attachment; filename*=UTF-8''Gr%C3%BC%C3%9Fe.pdf\r\n\
    \r\n\
    data\r\n\
    --BOUNDARY--\r\n\
    "
  expectedAttachments:
    inline: []
    files:
      - { filename: Grüße.pdf }

- description: forwarded email attachment
  eml: "Content-Type: multipart/mixed; boundary=\"BOUNDARY\"\r\n\
    \r\n\
    --BOUNDARY\r\n\
    \r\n\
    Hello\r\n\
    --BOUNDARY\r\n\
    Content-Type: message/rfc822\r\n\
    Content-Disposition: attachment; filename=\"forwarded.eml\"\r\n\
    \r\n\
    Subject: Forwarded\r\n\
    \r\n\
    Forwarded body\r\n\
    --BOUNDARY--\r\n\
    "
  expectedAttachments:
    inline: []
    files:
      - { filename: forwarded.eml }

- description: HTML file attachment
  eml: "Content-Type: multipart/mixed; boundary=\"BOUNDARY\"\r\n\
    \r\n\
    --BOUNDARY\r\n\
    \r\n\
    Hello\r\n\
    --BOUNDARY\r\n\
    Content-Type: text/html\r\n\
    Content-Disposition: attachment; filename=\"page.html\"\r\n\
    \r\n\
    <p>Attached page</p>\r\n\
    --BOUNDARY--\r\n\
    "
  expectedAttachments:
    inline: []
    files:
      - { filename: page.html }

