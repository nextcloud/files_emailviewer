name: End-to-end tests

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - stable*

permissions:
  contents: read

concurrency:
  group: e2e-tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest-low

    outputs:
      branch-min: ${{ steps.versions.outputs.branches-min }}
      branch-max: ${{ steps.versions.outputs.branches-max }}

    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get version matrix
        id: versions
        uses: nextcloud-libraries/nextcloud-version-matrix@cd0211ffcef1065e2020cd579e4843b8746e7a58 # v1.3.3

  test:
    runs-on: ubuntu-latest

    needs: matrix

    strategy:
      # do not stop on another job's failure
      fail-fast: false
      matrix:
        server-branch: ['${{ needs.matrix.outputs.branch-min }}', '${{ needs.matrix.outputs.branch-max }}']

    name: e2e ${{ matrix.server-branch }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read package.json node and npm engines version
        uses: nextcloud-libraries/parse-package-engines-action@39fcc545a815c353dd0a3fd8fd2ef6e59fd02b92 # v0.2.0
        id: versions

      - name: Set up node ${{ steps.versions.outputs.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node-version }}

      - name: Set up npm ${{ steps.versions.outputs.package-manager-version }}
        run: npm i -g 'npm@${{ steps.versions.outputs.package-manager-version }}'

      - name: Install dependencies & build
        run: |
          npm ci
          npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Test against ${{ matrix.server-branch }}
        env:
          NEXTCLOUD_BRANCH: ${{ matrix.server-branch }}
        run: npm run test:e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-e2e-test-output-${{ matrix.server-branch }}
          path: tests/output/e2e/
          retention-days: 7

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest-low
    needs: test

    if: always()

    name: e2e-test-summary

    steps:
      - name: Summary status
        run: if ${{ needs.test.result != 'success' }}; then exit 1; fi
